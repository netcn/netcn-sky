<script>
(function () {
  function current() {
    try {
      var m = (document.cookie || '').match(/(?:^|; )ncn_lang=(zh|en)/);
      if (m) return m[1];
      var s = localStorage.getItem('lang');
      if (s === 'en' || s === 'zh') return s;
    } catch (e) {}
    return document.documentElement.lang === 'en' ? 'en' : 'zh';
  }
  function apply(lang) {
    var l = lang === 'en' ? 'en' : 'zh';
    var key = 'data-' + l;
    document.querySelectorAll('[data-zh][data-en]').forEach(function (el) {
      var v = el.getAttribute(key);
      if (v != null) el.textContent = v;
    });
    document.documentElement.lang = l === 'en' ? 'en' : 'zh-CN';
    document.title = l === 'en' ? 'Page not found · Sky Watch' : '页面没有找到 · 火烧云';
  }
  apply(current());
  document.addEventListener('ncn:lang', function (e) {
    apply(e.detail && e.detail.lang);
  });
})();
</script>
